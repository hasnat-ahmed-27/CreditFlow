name: backend-ci

# Runs pytest for every backend service that has tests. Required to pass before
# a PR can merge (enforce via branch protection on dev/main). Grows automatically
# as services are added — no need to edit this file per service.
on:
  pull_request:
    paths: ["services/**", "libs/**", "ruff.toml", ".github/workflows/backend-ci.yml"]
  push:
    branches: [dev, main]
    paths: ["services/**", "libs/**", "ruff.toml"]

jobs:
  # §9 requires CI to pass "lint, unit tests, Docker build". Lint is a separate,
  # fast job so a style slip fails in ~10s without waiting on the test matrix,
  # and a green tick clearly attributes to the right gate.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff==0.16.0    # pin: identical rules in CI and locally
          # Reads the committed ruff.toml at the repo root.
          ruff check --output-format=github services libs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shared library + test tools
        run: |
          python -m pip install --upgrade pip
          pip install ./libs
          # httpx<0.28 — newer httpx removed the API Starlette 0.37.2 (FastAPI 0.111)
          # TestClient relies on, which otherwise breaks every TestClient-based test.
          pip install pytest "httpx<0.28"

      - name: Test each service that has tests
        run: |
          set -e
          failed=0
          for d in services/*/ ; do
            if compgen -G "${d}test_*.py" > /dev/null || compgen -G "${d}tests/*.py" > /dev/null; then
              echo "::group::pytest ${d}"
              pip install -r "${d}requirements.txt" || true
              ( cd "$d" && PYTHONPATH=. pytest -q ) || failed=1
              echo "::endgroup::"
            fi
          done
          exit $failed

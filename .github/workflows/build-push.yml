name: build-push

# On push to main, build every service image (from the repo-root context so the
# shared libs/ is available) and push to GHCR with an incrementing version tag.
# Auto-discovers services — no per-service edits needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          # every services/<name>/ that has a Dockerfile, excluding the template
          list=$(for d in services/*/; do
                   name=$(basename "$d")
                   [ "$name" = "_template" ] && continue
                   [ -f "${d}Dockerfile" ] && echo "$name"
                 done | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "services=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/creditflow-${{ matrix.service }}:v${{ github.run_number }}
            ghcr.io/${{ steps.owner.outputs.owner }}/creditflow-${{ matrix.service }}:latest

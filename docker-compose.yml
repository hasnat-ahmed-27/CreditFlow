# CreditFlow — full stack. Phase 0 brings up shared infrastructure.
# Application services are added to this file as each phase is built (a
# commented example service block is shown at the bottom).
#
#   docker compose up -d           # infra
#   docker compose logs -f rabbitmq

services:
  # ---- PostgreSQL: one instance, schema-per-service ----
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creditflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creditflow}
      POSTGRES_DB: ${POSTGRES_DB:-creditflow}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [creditflow]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creditflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Redis: cache, JWT jti store, rate-limit counters, SSE pub/sub, Celery broker ----
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    networks: [creditflow]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- RabbitMQ: topic exchanges per domain, durable queues, DLQ ----
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-creditflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-creditflow}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI (http://localhost:15672)
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    networks: [creditflow]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- MongoDB: scraper documents only ----
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-creditflow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-creditflow}
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db
    networks: [creditflow]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =========================================================================
  # Application services (one block per phase as it is built)
  # =========================================================================

  # ---- Auth: identity, JWT issuance (only holder of the private key) ----
  auth:
    build:
      context: .                          # repo root so libs/ is in the build context
      dockerfile: services/auth/Dockerfile
    environment:
      SERVICE_NAME: auth
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@postgres:5432/${POSTGRES_DB:-creditflow}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-creditflow}:${RABBITMQ_PASS:-creditflow}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      JWT_PRIVATE_KEY_PATH: /keys/jwt_private.pem   # auth only — other services get just the public key
      AUTH_EXPOSE_DEV_TOKENS: "1"   # DEV ONLY: echoes verification/reset tokens in responses until the Notification service exists
      USER_URL: http://user:8000    # resolves the real account_id/role claims before minting a token
      # Platform SuperAdmins (spec §8/13) — comma-separated emails, reconciled
      # into users.is_superadmin on startup. Empty = no SuperAdmin exists.
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
    ports: ["8001:8000"]
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [creditflow]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- User/Tenant: accounts, membership, roles, invites ----
  user:
    build:
      context: .                          # repo root so libs/ is in the build context
      dockerfile: services/user/Dockerfile
    environment:
      SERVICE_NAME: user
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@postgres:5432/${POSTGRES_DB:-creditflow}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-creditflow}:${RABBITMQ_PASS:-creditflow}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem   # public key only — this service verifies, never mints
      USER_EXPOSE_DEV_TOKENS: "1"   # DEV ONLY: echoes invite tokens in responses until the Notification service exists
    ports: ["8002:8000"]
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [creditflow]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Billing: Stripe (test mode), subscriptions, dunning, transactional outbox ----
  billing:
    build:
      context: .                          # repo root so libs/ is in the build context
      dockerfile: services/billing/Dockerfile
    environment:
      SERVICE_NAME: billing
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@postgres:5432/${POSTGRES_DB:-creditflow}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-creditflow}:${RABBITMQ_PASS:-creditflow}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem   # public key only — this service verifies, never mints
      # Stripe TEST-MODE keys only (sk_test_... enforced at startup) — set in .env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      BILLING_POLLER_ENABLED: "1"   # outbox poller + dunning ticker run in-process (thread)
    ports: ["8003:8000"]
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [creditflow]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Credits/Marketplace: append-only ledger, invoice.paid grants, P2P transfers ----
  credits:
    build:
      context: .                          # repo root so libs/ is in the build context
      dockerfile: services/credits/Dockerfile
    environment:
      SERVICE_NAME: credits
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@postgres:5432/${POSTGRES_DB:-creditflow}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-creditflow}:${RABBITMQ_PASS:-creditflow}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem   # public key only — this service verifies, never mints
      CREDITS_CONSUMER_ENABLED: "1"   # billing_events + usage_events + account_events consumers run in-process (one thread per queue)
      CREDITS_PER_1K_TOKENS: "1"      # AI generation price: ceil(total_tokens / 1000) credits (see ledger.py)
      CREDITS_STARTER_GRANT: ${CREDITS_STARTER_GRANT:-100}   # free-plan welcome balance, granted once per account on account.created
    ports: ["8004:8000"]
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [creditflow]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Usage/Metering: Redis quota counters (fast checks) + append-only usage_ledger (durable truth) ----
  usage:
    build:
      context: .                          # repo root so libs/ is in the build context
      dockerfile: services/usage/Dockerfile
    environment:
      SERVICE_NAME: usage
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@postgres:5432/${POSTGRES_DB:-creditflow}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-creditflow}:${RABBITMQ_PASS:-creditflow}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem   # public key only — this service verifies, never mints
      USAGE_CONSUMER_ENABLED: "1"   # usage_events consumer runs in-process (thread); declares our durable queue before the AI service exists
      USAGE_QUOTA_TOKENS: "100000"  # monthly token quota per account (80%/100% threshold events derive from this)
    ports: ["8005:8000"]
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [creditflow]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- AI Generation: OpenRouter streaming -> Redis pub/sub fan-out -> SSE ----
  ai:
    build:
      context: .                          # repo root so libs/ is in the build context
      dockerfile: services/ai/Dockerfile
    environment:
      SERVICE_NAME: ai
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@postgres:5432/${POSTGRES_DB:-creditflow}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-creditflow}:${RABBITMQ_PASS:-creditflow}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem   # public key only — this service verifies, never mints
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}   # set in .env — required for real generations
      USAGE_URL: http://usage:8000    # synchronous quota gate before every generation
      AI_MODEL_FAST: ${AI_MODEL_FAST:-openai/gpt-4o-mini}            # cheap/fast choice
      AI_MODEL_QUALITY: ${AI_MODEL_QUALITY:-anthropic/claude-sonnet-4}  # higher-quality choice
    ports: ["8006:8000"]
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      usage: { condition: service_healthy }   # quota gate fails closed without it
    networks: [creditflow]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Content: versioned posts, draft -> approved -> scheduled -> published lifecycle ----
  content:
    build:
      context: .                          # repo root so libs/ is in the build context
      dockerfile: services/content/Dockerfile
    environment:
      SERVICE_NAME: content
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@postgres:5432/${POSTGRES_DB:-creditflow}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-creditflow}:${RABBITMQ_PASS:-creditflow}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem   # public key only — this service verifies, never mints
      CONTENT_CONSUMER_ENABLED: "1"   # ai.generation_completed consumer runs in-process (thread); drains the queue the AI service pre-declared
      CONTENT_MEDIA_DIR: /data/media  # uploaded post images — local-volume object storage for dev (S3 later)
    ports: ["8007:8000"]
    volumes:
      - ./keys:/keys:ro
      - contentmedia:/data/media
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [creditflow]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Scheduler: content calendar — Celery Beat scans due schedules, a
  # worker task emits content.scheduled for the Social Publishing service.
  # ONE image, THREE processes: the API below, plus scheduler-worker and
  # scheduler-beat which override the command.
  scheduler:
    build:
      context: .                          # repo root so libs/ is in the build context
      dockerfile: services/scheduler/Dockerfile
    environment:
      SERVICE_NAME: scheduler
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@postgres:5432/${POSTGRES_DB:-creditflow}
      REDIS_URL: redis://redis:6379/0                 # fire lock lives with the caching Redis
      CELERY_BROKER_URL: redis://redis:6379/1         # broker+backend on their OWN logical DB (spec)
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-creditflow}:${RABBITMQ_PASS:-creditflow}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem   # public key only — this service verifies, never mints
      SCHEDULER_CONSUMER_ENABLED: "1"   # content_events consumer runs in-process (thread); drains the queue the Content service pre-declared
    ports: ["8008:8000"]
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [creditflow]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery worker — executes the scan/fire tasks beat dispatches. No HTTP
  # surface and never touches JWTs, so no port, no keys mount, no healthcheck
  # (a `celery inspect ping` probe costs more than it tells here).
  scheduler-worker:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info"]
    environment:
      SERVICE_NAME: scheduler-worker
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@postgres:5432/${POSTGRES_DB:-creditflow}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-creditflow}:${RABBITMQ_PASS:-creditflow}@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [creditflow]

  # Celery beat — ticks tasks.scan_due_schedules every SCHEDULER_SCAN_INTERVAL
  # seconds (default 60, the spec's example). Only talks to the broker.
  scheduler-beat:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    command: ["celery", "-A", "celery_app", "beat", "--loglevel=info"]
    environment:
      SERVICE_NAME: scheduler-beat
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis: { condition: service_healthy }
    networks: [creditflow]

  # ---- Social Publishing: LinkedIn OAuth connections (tokens encrypted at
  # rest) + text/image publishing. Consumes content.scheduled from the queue
  # the Scheduler pre-declared and emits post.published / post.failed.
  social:
    build:
      context: .                          # repo root so libs/ is in the build context
      dockerfile: services/social/Dockerfile
    environment:
      SERVICE_NAME: social
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@postgres:5432/${POSTGRES_DB:-creditflow}
      REDIS_URL: redis://redis:6379/0                 # OAuth CSRF-state store
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-creditflow}:${RABBITMQ_PASS:-creditflow}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem   # public key only — this service verifies, never mints
      SOCIAL_CONSUMER_ENABLED: "1"   # scheduler_events consumer runs in-process (thread); drains the queue the Scheduler pre-declared
      CONTENT_URL: http://content:8000    # authoritative post body + stored media
      # LinkedIn app registration — each developer brings their own (spec); set in .env
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-}
      # Fernet key for token-at-rest encryption — generate with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      SOCIAL_TOKEN_ENCRYPTION_KEY: ${SOCIAL_TOKEN_ENCRYPTION_KEY:-}
      # DEV ONLY stopgap until the service-auth story exists: a bearer the
      # consumer uses to fetch authoritative content; unset, it degrades to
      # the fire event's title/image_url mirrors (see services/social/consumer.py).
      SOCIAL_CONTENT_TOKEN: ${SOCIAL_CONTENT_TOKEN:-}
    ports: ["8009:8000"]
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [creditflow]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Scraper: on-demand + recurring web scraping (Playwright/Chromium)
  # into MongoDB (the stack's one document-store service). Consumes
  # scrape.requested and emits scrape.completed / scrape.failed on
  # scraper_events. ONE image, THREE processes (same pattern as the
  # Scheduler): the API below, plus scraper-worker and scraper-beat which
  # override the command.
  scraper:
    build:
      context: .                          # repo root so libs/ is in the build context
      dockerfile: services/scraper/Dockerfile
    environment:
      SERVICE_NAME: scraper
      # Postgres holds ONLY the processed_events idempotency ledger (schema
      # `scraper`) — domain data lives in Mongo per the spec.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@postgres:5432/${POSTGRES_DB:-creditflow}
      MONGO_URL: mongodb://${MONGO_USER:-creditflow}:${MONGO_PASS:-creditflow}@mongo:27017/
      CELERY_BROKER_URL: redis://redis:6379/2         # broker+backend on their OWN logical DB (/1 is the Scheduler's)
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-creditflow}:${RABBITMQ_PASS:-creditflow}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem   # public key only — this service verifies, never mints
      SCRAPER_CONSUMER_ENABLED: "1"   # scrape.requested consumer runs in-process (thread)
      # Engine config (see services/scraper/scraper_engine.py) — the API
      # never scrapes, but shares the image/env with the worker.
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-CreditFlowScraper/0.1}
      SCRAPER_MIN_DELAY_SECONDS: ${SCRAPER_MIN_DELAY_SECONDS:-2}
      SCRAPER_TIMEOUT_SECONDS: ${SCRAPER_TIMEOUT_SECONDS:-30}
    ports: ["8010:8000"]
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [creditflow]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery worker — executes the scan/scrape tasks; the ONLY container that
  # launches Chromium. No HTTP surface and never touches JWTs, so no port,
  # no keys mount, no healthcheck (same rationale as scheduler-worker).
  scraper-worker:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info"]
    environment:
      SERVICE_NAME: scraper-worker
      MONGO_URL: mongodb://${MONGO_USER:-creditflow}:${MONGO_PASS:-creditflow}@mongo:27017/
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-creditflow}:${RABBITMQ_PASS:-creditflow}@rabbitmq:5672/
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-CreditFlowScraper/0.1}
      SCRAPER_MIN_DELAY_SECONDS: ${SCRAPER_MIN_DELAY_SECONDS:-2}
      SCRAPER_TIMEOUT_SECONDS: ${SCRAPER_TIMEOUT_SECONDS:-30}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [creditflow]

  # Celery beat — the spec's "internal scheduler" for recurring scrapes:
  # ticks tasks.scan_due_scrapes every SCRAPER_SCAN_INTERVAL seconds
  # (default 60). Only talks to the broker.
  scraper-beat:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    command: ["celery", "-A", "celery_app", "beat", "--loglevel=info"]
    environment:
      SERVICE_NAME: scraper-beat
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis: { condition: service_healthy }
    networks: [creditflow]

  # ---- Notification: the central outbound-email consumer — drains the six
  # notifications.* queues the other services pre-declared and sends via
  # Resend (primary) / Mailgun (fallback), logging every send in
  # notification_log. Emits notification.sent. With the providers unset,
  # sends conclude as failed-and-logged (the *_EXPOSE_DEV_TOKENS stopgaps on
  # auth/user still echo tokens for dev flows).
  notification:
    build:
      context: .                          # repo root so libs/ is in the build context
      dockerfile: services/notification/Dockerfile
    environment:
      SERVICE_NAME: notification
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@postgres:5432/${POSTGRES_DB:-creditflow}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-creditflow}:${RABBITMQ_PASS:-creditflow}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem   # public key only — this service verifies, never mints
      NOTIFICATION_CONSUMER_ENABLED: "1"   # the six notifications.* queue consumers run in-process (threads)
      # Email providers (free tier, per spec) — set in .env. Resend is
      # primary; Mailgun is the fallback when both of its vars are set.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      # Sender identity — must be a sender/domain verified with the provider.
      NOTIFY_FROM_EMAIL: ${NOTIFY_FROM_EMAIL:-CreditFlow <no-reply@creditflow.local>}
      # Frontend base URL for the links in emails (verify/reset/invite/billing).
      NOTIFY_APP_BASE_URL: ${NOTIFY_APP_BASE_URL:-http://localhost:5173}
    ports: ["8011:8000"]
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [creditflow]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Admin/Ops: operational visibility — audit_log built by consuming
  # every domain event (`#`-bound on all ten exchanges, draining the
  # admin.notification_events queue Notification pre-declared), active-
  # session viewer/revocation reading the same Redis jti store Auth writes,
  # cross-account directory with suspend/reactivate, and a read-only
  # aggregate view pulled from User/Credits/Usage. Publishes nothing.
  admin:
    build:
      context: .                          # repo root so libs/ is in the build context
      dockerfile: services/admin/Dockerfile
    environment:
      SERVICE_NAME: admin
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@postgres:5432/${POSTGRES_DB:-creditflow}
      REDIS_URL: redis://redis:6379/0                 # active-session (jti) store — Auth writes it, we read/revoke
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-creditflow}:${RABBITMQ_PASS:-creditflow}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem   # public key only — this service verifies, never mints
      ADMIN_CONSUMER_ENABLED: "1"   # the ten admin.* queue consumers run in-process (threads)
      # Read-only aggregation targets for the per-account overview.
      USER_URL: http://user:8000
      CREDITS_URL: http://credits:8000
      USAGE_URL: http://usage:8000
    ports: ["8012:8000"]
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [creditflow]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- API Gateway: the single public entry point (:8080). Routes each
  # public path prefix to the owning service, VERIFIES the RS256 access token
  # and enforces per-route roles (§6) — then forwards the original
  # Authorization header untouched so services keep their own defence-in-depth
  # verification. Redis-backed per-IP + per-account rate limiting, provider
  # webhook ingress (verify signature -> Redis SETNX dedup -> publish
  # normalized event -> relay Stripe to Billing), response aggregation, CORS,
  # X-Request-ID, and the unbuffered SSE re-stream of the AI token stream.
  # The public key is mounted read-only (verify only — it still cannot mint;
  # only Auth holds the private key). Individual services keep their 80xx host
  # ports for direct dev access.
  gateway:
    build:
      context: .                          # repo root so libs/ is in the build context
      dockerfile: services/gateway/Dockerfile
    environment:
      SERVICE_NAME: gateway
      REDIS_URL: redis://redis:6379/0                 # all gateway state: rate-limit counters + webhook dedup keys
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-creditflow}:${RABBITMQ_PASS:-creditflow}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem       # public key only — the gateway verifies, never mints
      AUTH_URL: http://auth:8000
      USER_URL: http://user:8000
      BILLING_URL: http://billing:8000
      CREDITS_URL: http://credits:8000
      USAGE_URL: http://usage:8000
      AI_URL: http://ai:8000
      CONTENT_URL: http://content:8000
      SCHEDULER_URL: http://scheduler:8000
      SOCIAL_URL: http://social:8000
      SCRAPER_URL: http://scraper:8000
      NOTIFICATION_URL: http://notification:8000
      ADMIN_URL: http://admin:8000
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-*}   # frontend origin(s), comma-separated
      GATEWAY_RATE_LIMIT_PER_MINUTE: ${GATEWAY_RATE_LIMIT_PER_MINUTE:-120}            # per-IP
      GATEWAY_ACCOUNT_RATE_LIMIT_PER_MINUTE: ${GATEWAY_ACCOUNT_RATE_LIMIT_PER_MINUTE:-600}  # per-account
      # Webhook signature secrets (verify-before-act). Stripe reuses Billing's
      # endpoint secret so the SAME signature verifies at the gateway and on
      # the relayed request. LinkedIn falls back to the app client secret.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_WEBHOOK_SECRET: ${LINKEDIN_WEBHOOK_SECRET:-}
      OPENROUTER_WEBHOOK_SECRET: ${OPENROUTER_WEBHOOK_SECRET:-}
    ports: ["8080:8000"]                  # the one public port
    volumes:
      - ./keys:/keys:ro
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      auth: { condition: service_healthy }
      user: { condition: service_healthy }
      billing: { condition: service_healthy }
      credits: { condition: service_healthy }
      usage: { condition: service_healthy }
      ai: { condition: service_healthy }
      content: { condition: service_healthy }
      scheduler: { condition: service_healthy }
      social: { condition: service_healthy }
      scraper: { condition: service_healthy }
      notification: { condition: service_healthy }
      admin: { condition: service_healthy }
    networks: [creditflow]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Frontend: static React/Vite bundle served by nginx ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the static bundle — where the BROWSER reaches the
        # gateway, i.e. the host-published port, not the compose-internal DNS.
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-http://localhost:8080}
    ports: ["3000:80"]
    depends_on:
      gateway: { condition: service_healthy }
    networks: [creditflow]

networks:
  creditflow:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  mongodata:
  contentmedia:

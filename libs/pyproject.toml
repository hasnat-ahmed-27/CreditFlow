[project]
name = "creditflow-common"
version = "0.1.0"
description = "Shared utilities for CreditFlow services (JWT, RabbitMQ, idempotency, db)."
requires-python = ">=3.11"
dependencies = [
    "pyjwt[crypto]>=2.8.0",
    "pika>=1.3.2",
    "sqlalchemy>=2.0.43,<2.1",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["creditflow_common*"]
